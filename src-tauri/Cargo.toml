[package]
name = "relay"
version = "0.1.18"
description = "Relay - a lean API client"
authors = ["qoder"]
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
getrandom = "0.2"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "native-tls",
  "gzip",
  "brotli",
  "http2",
  "stream",
  "cookies",
  "multipart",
  "charset",
] }
tokio-tungstenite = { version = ">=0.23", features = ["native-tls"] }
base64 = "0.22"
native-tls = "0.2"
bytes = "1"
encoding_rs = "0.8"
tauri-plugin-dialog = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
